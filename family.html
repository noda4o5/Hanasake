<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おはなの水やり 家族用</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: status first (did she water today?), then the two-week strip, then the controls family members rarely touch. */
:root {
  --bg: #F3F7F6; --surface: #FFFFFF; --ink: #1F3330; --ink-soft: #566D69; --line: #D3E2DE;
  --accent: #2E7D6B; --accent-ink: #FFFFFF;
  --ok-bg: #E2F3E6; --ok-ink: #24653A; --wait-bg: #FFF2D6; --wait-ink: #8A5A00; --pause-bg: #E8ECF3; --pause-ink: #44506A;
  --font-display: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
  --font-body: "BIZ UDPGothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101C1A; --surface: #182826; --ink: #E6F0EE; --ink-soft: #A3B8B4; --line: #2E4642;
    --accent: #5FBFA6; --accent-ink: #0E1C19;
    --ok-bg: #1C3A26; --ok-ink: #9BDDAE; --wait-bg: #3A2E12; --wait-ink: #F2C875; --pause-bg: #252C3A; --pause-ink: #B8C3DA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101C1A; --surface: #182826; --ink: #E6F0EE; --ink-soft: #A3B8B4; --line: #2E4642;
  --accent: #5FBFA6; --accent-ink: #0E1C19;
  --ok-bg: #1C3A26; --ok-ink: #9BDDAE; --wait-bg: #3A2E12; --wait-ink: #F2C875; --pause-bg: #252C3A; --pause-ink: #B8C3DA;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-size: 24px; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; letter-spacing: .06em; color: var(--ink-soft); margin: 0 0 8px; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.today { border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.today.ok { background: var(--ok-bg); color: var(--ok-ink); }
.today.wait { background: var(--wait-bg); color: var(--wait-ink); }
.today.pause { background: var(--pause-bg); color: var(--pause-ink); }
.today .big { font-family: var(--font-display); font-size: 22px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { text-align: center; border-radius: 10px; padding: 6px 0; background: var(--bg); font-variant-numeric: tabular-nums; }
.day .d { font-size: 12px; color: var(--ink-soft); }
.day .m { font-size: 20px; line-height: 1.3; min-height: 26px; }
.day.is-today { outline: 2px solid var(--accent); }
.legend { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.url { font-size: 13px; word-break: break-all; background: var(--bg); border-radius: 8px; padding: 8px 10px; user-select: all; flex: 1 1 100%; min-width: 0; }
button.btn { appearance: none; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 700; cursor: pointer; }
button.btn.ghost { background: var(--surface); color: var(--accent); }
button.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-soft); }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
form { display: flex; flex-direction: column; gap: 12px; }
.note { font-size: 13px; color: var(--ink-soft); }
.toast { font-size: 14px; color: var(--accent); min-height: 1.4em; }
.err { background: var(--wait-bg); color: var(--wait-ink); border-radius: 12px; padding: 12px; }
</style>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.png">
</head>
<body>
<main class="wrap">
  <h1 id="title">見守り</h1>
  <div id="err" class="err" hidden></div>

  <section id="todayBox" class="today wait"><div class="big" id="todayBig">読みこみ中…</div><div id="todaySub"></div></section>

  <section class="card">
    <h2>この2週間</h2>
    <div class="strip" id="strip"></div>
    <div class="legend">😊 げんき　🙂 ふつう　😣 いまいち　・ 水やりなし</div>
  </section>

  <section class="card">
    <h2>今日の通知</h2>
    <div class="row">
      <button class="btn ghost" id="pauseBtn">今日は通知を止める</button>
      <span class="note">旅行や入院などで水やりできない日に</span>
    </div>
    <div class="toast" id="pauseToast"></div>
  </section>

  <section class="card">
    <h2>お母さまのスマホに入れるページ</h2>
    <div class="row">
      <div class="url" id="momUrl"></div>
      <button class="btn" id="copyBtn">アドレスをコピー</button>
      <button class="btn ghost" id="shareBtn">LINEなどで送る</button>
    </div>
    <div class="toast" id="copyToast"></div>
    <p class="note">お母さまのスマホでこのアドレスを開き、Chromeの右上「︙」→「ホーム画面に追加」を押すと、アイコンから開けるようになります。</p>
  </section>

  <section class="card">
    <h2>設定</h2>
    <form id="settings">
      <label for="sName">画面に出す呼び名（例：みちこさん）<input id="sName" maxlength="20"></label>
      <label for="sEmails">お知らせを受け取るメール（カンマ区切りで5つまで）<input id="sEmails" inputmode="email"></label>
      <label for="sHour">この時刻までに水やりがなければ知らせる<select id="sHour"></select></label>
      <div class="row"><button class="btn" type="submit">保存する</button><span class="toast" id="saveToast"></span></div>
    </form>
  </section>
</main>

<script src="/config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MOOD = { 1: '😊', 2: '🙂', 3: '😣' };
  var MOODT = { 1: 'げんき', 2: 'ふつう', 3: 'いまいち' };
  var API = (window.HANAMIZU_API || '').trim();
  function api(action, args) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, args: args || [] })
    }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  var isServer = !!API;
  var fid, key, st;

  for (var h = 6; h <= 20; h++) { var o = document.createElement('option'); o.value = h; o.textContent = h + '時'; $('sHour').appendChild(o); }

  function call(fn, args, ok) {
    if (!isServer) { ok(st); return; }
    api(fn, args).then(function (res) {
      if (!res || !res.ok) { showErr((res && res.error) || 'このページのアドレスが正しくないようです。登録時のメールのリンクから開いてください。'); return; }
      ok(res);
    }).catch(function () { showErr('通信できませんでした。少し待ってからもう一度試してください。'); });
  }
  function showErr(t) { $('err').textContent = t; $('err').hidden = !t; }

  function render(s) {
    st = s; showErr('');
    var who = s.name || 'お母さま';
    $('title').textContent = who + 'の見守り';
    var box = $('todayBox');
    if (s.today) {
      box.className = 'today ok';
      $('todayBig').textContent = '今日は ' + s.today.time + ' にお水をあげました';
      $('todaySub').textContent = 'きぶん：' + MOOD[s.today.mood] + ' ' + MOODT[s.today.mood];
    } else if (s.pausedToday) {
      box.className = 'today pause';
      $('todayBig').textContent = '今日は通知を止めています';
      $('todaySub').textContent = '前回の水やり：' + (s.lastAt || 'まだありません');
    } else {
      box.className = 'today wait';
      $('todayBig').textContent = '今日のお水はまだです';
      $('todaySub').textContent = (s.nowHour >= s.hour ? s.hour + '時を過ぎたので、メールでお知らせしました。' : s.hour + '時までになければメールでお知らせします。') + '　前回：' + (s.lastAt || 'まだありません');
    }
    var html = '';
    s.recent.forEach(function (d, i) {
      var p = d.date.split('-');
      html += '<div class="day' + (i === s.recent.length - 1 ? ' is-today' : '') + '" title="' + (d.time ? d.time + ' ' + MOODT[d.mood] : '水やりなし') + '">' +
        '<div class="d">' + Number(p[1]) + '/' + Number(p[2]) + '</div><div class="m">' + (d.mood ? MOOD[d.mood] : '・') + '</div></div>';
    });
    $('strip').innerHTML = html;
    $('pauseBtn').textContent = s.pausedToday ? '止めた通知を元にもどす' : '今日は通知を止める';
    $('momUrl').textContent = s.momUrl;
    $('sName').value = s.name; $('sEmails').value = s.emails; $('sHour').value = String(s.hour);
  }

  $('pauseBtn').addEventListener('click', function () {
    var on = !st.pausedToday;
    call('setPause', [fid, key, on], function (res) {
      if (!isServer) { res.pausedToday = on; }
      render(res); $('pauseToast').textContent = on ? '今日のお知らせを止めました' : 'お知らせを元にもどしました';
    });
  });
  $('copyBtn').addEventListener('click', function () {
    var t = st.momUrl;
    var done = function () { $('copyToast').textContent = 'コピーしました'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, selectUrl);
    } else selectUrl();
  });
  function selectUrl() {
    var r = document.createRange(); r.selectNodeContents($('momUrl'));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    $('copyToast').textContent = '選んだアドレスを長押ししてコピーしてください';
  }
  $('shareBtn').addEventListener('click', function () {
    var text = '毎日このページでお花にお水をあげてね。きぶんのボタンを押すだけです。';
    if (navigator.share) {
      navigator.share({ title: 'おはなの水やり', text: text, url: st.momUrl }).catch(function () {});
    } else {
      $('copyToast').textContent = 'この画面からは送れません。「アドレスをコピー」を使ってください';
    }
  });
  $('settings').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = { name: $('sName').value, emails: $('sEmails').value, hour: Number($('sHour').value) };
    call('updateSettings', [fid, key, s], function (res) {
      if (!isServer) { res.name = s.name; res.emails = s.emails; res.hour = s.hour; }
      render(res); $('saveToast').textContent = '保存しました';
    });
  });

  if (isServer) {
    var q = new URLSearchParams(location.search);
    fid = q.get('f'); key = q.get('k');
    call('getFamilyState', [fid, key], render);
  } else {
    // ローカルで開いたときの見本表示
    var today = new Date(), recent = [];
    var sample = [1, 1, 2, null, 1, 2, 1, 1, 3, 2, 1, 1, 2, null];
    for (var i = 13; i >= 0; i--) {
      var d = new Date(today); d.setDate(today.getDate() - i);
      var m = sample[13 - i];
      recent.push({ date: d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), mood: m, time: m ? '8:1' + (i % 10) : null });
    }
    render({ ok: true, name: '（見本）お母さん', emails: 'example@example.com', hour: 10, pausedToday: false, today: null, lastAt: '昨日 8:10', recent: recent, momUrl: location.origin + '/?f=…', nowHour: today.getHours() });
  }
})();
</script>
</body>
</html>
